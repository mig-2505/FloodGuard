# FLOODGUARD - CONFIGURACOES

spring.application.name=floodguard

# Aplicacao de console
spring.main.web-application-type=none

# H2 DATABASE

spring.datasource.url=jdbc:h2:file:./data/floodguard
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SPRING DATA JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# LOGS

logging.level.org.springframework=INFO

# Menu de console
floodguard.console.enabled=true

# Codigo de acesso para alterar os limites
floodguard.codigo-acesso=${FLOODGUARD_CODIGO:1234}
